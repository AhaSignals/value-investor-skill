name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag version
        run: python -c 'import os; from core import __version__; assert os.environ["GITHUB_REF_NAME"] == "v" + __version__'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_public_identity.py
      - run: python scripts/package_release.py --out dist
      - name: Publish tested source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --verify-tag --title "Value Investor Skill $GITHUB_REF_NAME" --notes-file docs/release-notes.md
