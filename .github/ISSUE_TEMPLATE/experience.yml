name: Installation, research or translation feedback
description: Tell us where company research, source retrieval or the examples stopped being useful.
title: "[Experience] "
body:
  - type: dropdown
    id: area
    attributes:
      label: What did you try?
      options:
        - Chat instructions / two-minute trial
        - Browser example
        - Company-name research / public-source retrieval
        - Microsoft real-company example
        - Offline source-capture replay
        - Local Python demo
        - Skill installation
        - Research workflow
        - Language guide
    validations:
      required: true
  - type: dropdown
    id: assistant
    attributes:
      label: Which assistant or host?
      options:
        - Claude
        - ChatGPT / Codex
        - DeepSeek
        - Grok
        - Gemini / Gemini CLI
        - Kimi / Kimi Code
        - Browser demo only
        - Other
  - type: input
    id: language
    attributes:
      label: Guide language and version
      placeholder: English, v0.5.0
  - type: input
    id: public_company
    attributes:
      label: Public company name or ticker (optional)
      description: For a real-company attempt, name the public security only. Do not include holdings or account details.
      placeholder: MSFT / Microsoft
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened?
      description: Include the step, command or redacted error if useful. Did a source or missing field change your interpretation? Do not include private holdings, personal paths, credentials or licensed documents.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment or suggested correction
      description: For installation or source retrieval, include OS, Python version, host and report status (for example PARTIAL). For a translation, quote the phrase and suggest an alternative.
